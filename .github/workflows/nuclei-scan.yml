name: Nuclei Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuclei-scan:
    name: Run Nuclei Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start application and database
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to become ready"
          docker compose logs
          exit 1

      - name: Prepare Nuclei output directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/nuclei-output"
          chmod 777 "$GITHUB_WORKSPACE/nuclei-output"

      - name: Run Nuclei
        run: |
          APP_CONTAINER=$(docker compose ps -q app)

          APP_NETWORK=$(docker inspect "$APP_CONTAINER" \
            --format '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' \
            | head -n 1)

          echo "Using Docker network: $APP_NETWORK"

          docker run --rm \
            --network "$APP_NETWORK" \
            -v "$GITHUB_WORKSPACE/nuclei-output:/output:rw" \
            projectdiscovery/nuclei:v3.11.1 \
            -u http://app:3000 \
            -tags misconfig,exposure \
            -severity info,low,medium,high,critical \
            -rl 5 \
            -c 5 \
            -ni \
            -jsonl-export /output/nuclei-results.jsonl \
            -o /output/nuclei-results.txt

      - name: Upload Nuclei reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuclei-scan-results
          path: |
            nuclei-output/nuclei-results.jsonl
            nuclei-output/nuclei-results.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stop application
        if: always()
        run: docker compose down -v
