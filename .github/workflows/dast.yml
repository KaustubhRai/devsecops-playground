name: DAST - OWASP ZAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: Run ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start application and database
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to become ready"
          docker compose logs
          exit 1

      - name: Prepare ZAP output directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-output"
          chmod 777 "$GITHUB_WORKSPACE/zap-output"

      - name: Run ZAP Baseline Scan
        run: |
          APP_CONTAINER=$(docker compose ps -q app)

          APP_NETWORK=$(docker inspect "$APP_CONTAINER" \
            --format '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' \
            | head -n 1)

          echo "Using Docker network: $APP_NETWORK"

          docker run --rm \
            --network "$APP_NETWORK" \
            -v "$GITHUB_WORKSPACE/zap-output:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://app:3000/health \
            -r zap-report.html \
            -J zap-report.json

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zap-baseline-report
          path: |
            zap-output/zap-report.html
            zap-output/zap-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Stop application
        if: always()
        run: docker compose down -v